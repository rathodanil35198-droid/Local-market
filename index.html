<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ನಮ್ಮ ಶಾಪುರ್ - ಗ್ರಾಹಕರ ಆಪ್ | Customer App</title>
  <link rel="icon" type="image/png" sizes="192x192" href="AR_Taxi_Booking_Go_Fast_512x512.png">

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, getDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAm3HFKu101wex1b025-zJZ2BJ_o1Xvw",
      authDomain: "ar-taxi-booking-shahapur.firebaseapp.com",
      projectId: "ar-taxi-booking-shahapur",
      storageBucket: "ar-taxi-booking-shahapur.appspot.com",
      messagingSenderId: "585815710897",
      appId: "1:586815710897:web:ab7138b9c016843db95dsa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.onSnapshot = onSnapshot;
    window.doc = doc;
    window.getDoc = getDoc;
    window.query = query;
    window.orderBy = orderBy;
    window.serverTimestamp = serverTimestamp;
  </script>

  <style>
    :root { --primary: #1976d2; --success: #388e3c; --warning: #ffa000; --bg: #f4f6f8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: #333; padding-bottom: 70px; }

    header { background: var(--primary); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.1rem; }

    .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }

    /* Product Grid */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
    .card { border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; background: #fff; cursor: pointer; transition: 0.2s; }
    .card img { width: 100%; height: 140px; object-fit: cover; }
    .card-body { padding: 8px; }
    .card-title { font-size: 0.82rem; font-weight: bold; height: 34px; overflow: hidden; }
    .price-bar { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .price { font-size: 0.95rem; font-weight: bold; color: var(--success); }
    .old-price { font-size: 0.75rem; color: #888; text-decoration: line-through; }

    /* Single Product Detail View */
    #productDetailView { display: none; padding: 12px; }
    
    /* Horizontal Carousel / Slider */
    .slider-container { width: 100%; position: relative; overflow: hidden; border-radius: 8px; background: #f0f0f0; }
    .slider-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .slider-track img { width: 100%; flex-shrink: 0; height: 280px; object-fit: contain; scroll-snap-align: start; background: #fff; }
    
    .thumbnail-bar { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
    .thumbnail-bar img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 2px solid #ddd; cursor: pointer; }
    .thumbnail-bar img.active { border-color: var(--primary); }

    .delivery-badge { background: #e8f5e9; border: 1px solid #c8e6c9; color: var(--success); padding: 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin: 10px 0; display: flex; align-items: center; gap: 6px; }

    .btn-buy { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ff9800; color: white; border: none; padding: 15px; font-size: 1.05rem; font-weight: bold; cursor: pointer; text-align: center; z-index: 99; }
    
    /* Modal Order Form */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-box { background: #fff; width: 90%; max-width: 400px; padding: 20px; border-radius: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="headerTitle">🏪 ನಮ್ಮ ಶಾಪುರ್ - ಗ್ರಾಹಕರ ಆಪ್</h1>
      <button id="backBtn" style="display:none; background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;" onclick="showHome()">← ಹಿಂದೆ ಹೋಗಿ</button>
    </header>

    <!-- Product List View -->
    <div id="homeView">
      <div id="productGrid" class="grid"></div>
    </div>

    <!-- Product Detail View -->
    <div id="productDetailView">
      
      <!-- Flipkart Style Image Slider -->
      <div class="slider-container">
        <div class="slider-track" id="sliderTrack"></div>
      </div>
      <div class="thumbnail-bar" id="thumbnailBar"></div>

      <h2 id="detailTitle" style="font-size:1.1rem; margin-top:12px;">--</h2>
      <p id="detailShop" style="font-size:0.8rem; color:#666; margin-top:2px;">ಅಂಗಡಿ: --</p>

      <div class="price-bar" style="margin-top:6px;">
        <span id="detailPrice" style="font-size:1.4rem; font-weight:bold; color:var(--success);">₹0</span>
        <span id="detailOldPrice" style="font-size:0.9rem; color:#888; text-decoration:line-through;">₹0</span>
      </div>

      <!-- Fast Delivery & Open Box Delivery Badges -->
      <div class="delivery-badge">
        🚚 <span><b>ಫಾಸ್ಟ್ ಡೆಲಿವರಿ:</b> 2 ದಿನಗಳ ಒಳಗೆ ಮನೆ ಬಾಗಿಲಿಗೆ ತಲುಪಿಸಲಾಗುವುದು!</span>
      </div>
      <div class="delivery-badge" style="background:#e3f2fd; border-color:#90caf9; color:#1565c0;">
        📦 <span><b>ಓಪನ್ ಬಾಕ್ಸ್ ಡೆಲಿವರಿ:</b> ವಸ್ತುವನ್ನು ಪರಿಶೀಲಿಸಿ ಸ್ವೀಕರಿಸಬಹುದು!</span>
      </div>

      <!-- Dynamic Product Attributes (Visible only if applicable) -->
      <div id="dynamicAttributes" style="margin-top:10px;"></div>

      <button class="btn-buy" onclick="openOrderModal()">ಈಗ ಖರೀದಿಸಿ (Buy Now)</button>
    </div>
  </div>

  <!-- Checkout Order Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-box">
      <h3>🛍️ ಆರ್ಡರ್ ಕನ್ಫರ್ಮ್ ಮಾಡಿ</h3>
      <form onsubmit="submitCustomerOrder(event)" style="margin-top:10px;">
        <div class="form-group"><label>ನಿಮ್ಮ ಹೆಸರು:</label><input type="text" id="custName" required placeholder="ಹೆಸರು"></div>
        <div class="form-group"><label>ಮೊಬೈಲ್ ನಂಬರ್:</label><input type="tel" id="custPhone" required placeholder="ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"></div>
        <div class="form-group"><label>ಊರು / ವಿಳಾಸ:</label><input type="text" id="custVillage" required placeholder="ಉದಾ: ಭೀಮರಾಯನಗುಡಿ, ಶಹಾಪುರ"></div>
        <div style="display:flex; gap:8px;">
          <button type="submit" class="btn-buy" style="position:static; transform:none; border-radius:6px; flex:1; background:var(--success);">ಆರ್ಡರ್ ಕನ್ಫರ್ಮ್</button>
          <button type="button" class="btn-buy" style="position:static; transform:none; border-radius:6px; flex:1; background:#757575;" onclick="closeOrderModal()">ಕ್ಯಾನ್ಸಲ್</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentProduct = null;
    let productsList = [];

    window.addEventListener('DOMContentLoaded', () => {
      startRealtimeProducts();
    });

    function startRealtimeProducts() {
      const q = window.query(window.collection(window.db, "products"), window.orderBy("timestamp", "desc"));
      window.onSnapshot(q, (snapshot) => {
        productsList = [];
        snapshot.forEach(docSnap => {
          productsList.push({ docId: docSnap.id, ...docSnap.data() });
        });
        renderProductsGrid(productsList);
      });
    }

    function renderProductsGrid(list) {
      const grid = document.getElementById('productGrid');
      if (list.length === 0) {
        grid.innerHTML = '<p style="grid-column: span 2; text-align:center; padding:20px; color:#777;">ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>';
        return;
      }

      grid.innerHTML = list.map(p => `
        <div class="card" onclick="viewProduct('${p.docId}')">
          <img src="${p.photo || 'https://via.placeholder.com/150'}">
          <div class="card-body">
            <div class="card-title">${p.name}</div>
            <div class="price-bar">
              <span class="price">₹${p.price}</span>
              ${p.oldPrice ? `<span class="old-price">₹${p.oldPrice}</span>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function viewProduct(docId) {
      currentProduct = productsList.find(p => p.docId === docId);
      if (!currentProduct) return;

      document.getElementById('homeView').style.display = 'none';
      document.getElementById('productDetailView').style.display = 'block';
      document.getElementById('backBtn').style.display = 'block';
      document.getElementById('headerTitle').innerText = 'ಪ್ರೊಡಕ್ಟ್ ವಿವರಣೆ';

      document.getElementById('detailTitle').innerText = currentProduct.name;
      document.getElementById('detailShop').innerText = `ಅಂಗಡಿ: ${currentProduct.shopName || 'ನಮ್ಮ ಶಾಪುರ್ ಸ್ಟೋರ್'}`;
      document.getElementById('detailPrice').innerText = `₹${currentProduct.price}`;
      document.getElementById('detailOldPrice').innerText = currentProduct.oldPrice ? `₹${currentProduct.oldPrice}` : '';

      // Setup Flipkart Style Image Slider & Thumbnails
      const sliderTrack = document.getElementById('sliderTrack');
      const thumbnailBar = document.getElementById('thumbnailBar');

      let photos = [];
      if (currentProduct.photo) photos.push(currentProduct.photo);
      if (currentProduct.photo2) photos.push(currentProduct.photo2);
      if (currentProduct.photo3) photos.push(currentProduct.photo3);

      sliderTrack.innerHTML = photos.map(imgSrc => `<img src="${imgSrc}">`).join('');

      if (photos.length > 1) {
        thumbnailBar.style.display = 'flex';
        thumbnailBar.innerHTML = photos.map((imgSrc, idx) => `
          <img src="${imgSrc}" class="${idx === 0 ? 'active' : ''}" onclick="scrollToImage(${idx})">
        `).join('');
      } else {
        thumbnailBar.style.display = 'none';
      }

      // Display Details Specific to Category
      const attrDiv = document.getElementById('dynamicAttributes');
      attrDiv.innerHTML = '';
      if (currentProduct.details) {
        attrDiv.innerHTML = `<p style="font-size:0.85rem; background:#f9f9f9; padding:8px; border-radius:6px;"><b>ವಿವರಗಳು:</b> ${currentProduct.details}</p>`;
      }
    }

    function scrollToImage(index) {
      const track = document.getElementById('sliderTrack');
      const imgs = track.querySelectorAll('img');
      if (imgs[index]) {
        imgs[index].scrollIntoView({ behavior: 'smooth', inline: 'start' });
        document.querySelectorAll('.thumbnail-bar img').forEach((thumb, i) => {
          thumb.classList.toggle('active', i === index);
        });
      }
    }

    function showHome() {
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('productDetailView').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('headerTitle').innerText = '🏪 ನಮ್ಮ ಶಾಪುರ್ - ಗ್ರಾಹಕರ ಆಪ್';
    }

    function openOrderModal() {
      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    async function submitCustomerOrder(e) {
      e.preventDefault();
      if (!currentProduct) return;

      const orderData = {
        productId: currentProduct.docId,
        productName: currentProduct.name,
        totalPrice: currentProduct.price,
        productPhoto: currentProduct.photo,
        shopId: currentProduct.shopId || '',
        shopName: currentProduct.shopName || '',
        shopType: currentProduct.shopType || '',
        customer: {
          name: document.getElementById('custName').value.trim(),
          phone: document.getElementById('custPhone').value.trim(),
          village: document.getElementById('custVillage').value.trim()
        },
        status: 'NEW',
        timestamp: window.serverTimestamp()
      };

      try {
        await window.addDoc(window.collection(window.db, "orders"), orderData);
        alert("🎉 ನಿಮ್ಮ ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಕಳುಹಿಸಲಾಗಿದೆ! 2 ದಿನಗಳ ಒಳಗೆ ಡೆಲಿವರಿ ಆಗಲಿದೆ.");
        closeOrderModal();
        showHome();
      } catch (err) {
        alert("ಆರ್ಡರ್ ಮಾಡುವಲ್ಲಿ ದೋಷ: " + err.message);
      }
    }
  </script>
</body>
</html>
