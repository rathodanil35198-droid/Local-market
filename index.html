<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ನಮ್ಮ ಶಾಪುರ್ - ಗ್ರಾಹಕರ ಆಪ್</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAm3HFKu101wex1b025-zJZ2BJ_o1Xvw",
      authDomain: "ar-taxi-booking-shahapur.firebaseapp.com",
      projectId: "ar-taxi-booking-shahapur",
      storageBucket: "ar-taxi-booking-shahapur.appspot.com",
      messagingSenderId: "585815710897",
      appId: "1:586815710897:web:ab7138b9c016843db95dsa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.onSnapshot = onSnapshot;
    window.serverTimestamp = serverTimestamp;
  </script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 10px; }
    .container { max-width: 500px; margin: auto; background: white; padding: 15px; border-radius: 10px; }
    header { background: #1e88e5; color: white; padding: 10px; text-align: center; border-radius: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 15px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px; text-align: center; }
    .card img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; }
    .btn { background: #4caf50; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal-box { background: white; padding: 20px; border-radius: 10px; width: 300px; }
    .form-group { margin-bottom: 8px; text-align: left; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .tracker { display: flex; justify-content: space-between; font-size: 10px; background: #e3f2fd; padding: 6px; border-radius: 4px; margin-top: 5px; font-weight: bold; }
    .active { color: green; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h2>🛍️ ನಮ್ಮ ಶಾಪುರ್ - ಗ್ರಾಹಕರ ಮಾರ್ಕೆಟ್</h2>
    </header>

    <h3>🛒 ಲಭ್ಯವಿರುವ ವಸ್ತುಗಳು</h3>
    <div id="productsGrid" class="grid"></div>

    <h3 style="margin-top:20px;">📜 ನನ್ನ ಆರ್ಡರ್‌ಗಳು & ಲೈವ್ ಟ್ರ್ಯಾಕಿಂಗ್</h3>
    <div id="ordersList"></div>
  </div>

  <div id="buyModal" class="modal">
    <div class="modal-box">
      <h3>📍 ನಿಮ್ಮ ವಿಳಾಸ ನಮೂದಿಸಿ</h3>
      <form onsubmit="placeOrder(event)">
        <div class="form-group"><label>ಹೆಸರು:</label><input type="text" id="custName" required></div>
        <div class="form-group"><label>ಮೊಬೈಲ್:</label><input type="tel" id="custPhone" required></div>
        <div class="form-group"><label>ಊರು/ಬಡಾವಣೆ:</label><input type="text" id="custVillage" required></div>
        <button class="btn" type="submit">ಆರ್ಡರ್ ಕನ್ಫರ್ಮ್ ಮಾಡಿ</button>
      </form>
    </div>
  </div>

  <script>
    let selectedProd = null;
    let allProducts = [];

    window.addEventListener('DOMContentLoaded', () => {
      window.onSnapshot(window.collection(window.db, "products"), (snap) => {
        let prods = [];
        snap.forEach(d => prods.push({ id: d.id, ...d.data() }));
        allProducts = prods;
        renderProducts(prods);
      });

      window.onSnapshot(window.collection(window.db, "orders"), (snap) => {
        let ords = [];
        snap.forEach(d => ords.push({ id: d.id, ...d.data() }));
        renderOrders(ords);
      });
    });

    function renderProducts(prods) {
      document.getElementById('productsGrid').innerHTML = prods.map(p => `
        <div class="card">
          <img src="${p.photo}">
          <b>${p.name}</b>
          <div style="color:green; font-weight:bold;">₹${p.price}</div>
          <button class="btn" onclick="openBuyModal('${p.id}')">ಖರೀದಿಸಿ</button>
        </div>
      `).join('');
    }

    function openBuyModal(id) {
      selectedProd = allProducts.find(p => p.id === id);
      document.getElementById('buyModal').style.display = 'flex';
    }

    async function placeOrder(e) {
      e.preventDefault();
      const newOrder = {
        orderId: 'ORD_' + Math.floor(1000 + Math.random() * 9000),
        productName: selectedProd.name,
        totalPrice: selectedProd.price,
        shopId: selectedProd.shopId,
        customer: {
          name: document.getElementById('custName').value,
          phone: document.getElementById('custPhone').value,
          village: document.getElementById('custVillage').value
        },
        status: 'NEW',
        timestamp: window.serverTimestamp()
      };

      await window.addDoc(window.collection(window.db, "orders"), newOrder);
      document.getElementById('buyModal').style.display = 'none';
      alert("🎉 ಆರ್ಡರ್ ಕನ್ಫರ್ಮ್ ಆಗಿದೆ! ಅಂಗಡಿಯವರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ.");
    }

    function renderOrders(ords) {
      document.getElementById('ordersList').innerHTML = ords.map(o => `
        <div style="border-left: 4px solid #1e88e5; background:#fff; padding:8px; margin-top:8px;">
          <b>${o.productName} - ₹${o.totalPrice}</b>
          <div class="tracker">
            <span class="${o.status ? 'active':''}">1. ಕನ್ಫರ್ಮ್</span> > 
            <span class="${['PACKING','DELIVERED'].includes(o.status) ? 'active':''}">2. ಪ್ಯಾಕಿಂಗ್</span> > 
            <span class="${o.status === 'DELIVERED' ? 'active':''}">3. ತಲುಪಿದೆ</span>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
